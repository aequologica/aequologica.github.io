<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mondial 2026 — Joueurs "exportés" par pays de naissance</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f2ec; color: #1a1a18; }
header { padding: 24px 32px 0; }
h1 { font-size: 20px; font-weight: 500; letter-spacing: -.3px; }
.sub { font-size: 12px; color: #888; margin-top: 4px; }
.sub em { color: #555; font-style: normal; }
#map-wrap { position: relative; width: 100%; max-width: 1100px; margin: 16px auto 0; padding: 0 16px; }
svg { display: block; width: 100%; height: auto; }
.country { cursor: pointer; transition: opacity .12s; }
.country:hover { opacity: .7; }
#tooltip {
  position: fixed; pointer-events: none; display: none;
  background: #fff; border: 1px solid #e0dcd6;
  border-radius: 8px; padding: 12px 14px; font-size: 12px;
  color: #1a1a18; max-width: 260px;
  box-shadow: 0 4px 16px rgba(0,0,0,.10);
  z-index: 1000;
}
.tt-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
.tt-count { font-size: 28px; font-weight: 500; line-height: 1; color: #7b2d8b; margin: 4px 0 2px; }
.tt-label { font-size: 11px; color: #999; margin-bottom: 2px; }
.tt-sub { font-size: 10px; color: #bbb; margin-bottom: 6px; }
.tt-nations { font-size: 10px; color: #aaa; margin-bottom: 8px; font-style: italic; border-bottom: 1px solid #f0ede8; padding-bottom: 6px; }
.tt-player { font-size: 11px; color: #555; padding: 3px 0; border-top: 1px solid #f0ede8; display: flex; justify-content: space-between; gap: 8px; }
.tt-player:first-of-type { border-top: none; }
.tt-nation { color: #aaa; font-size: 10px; white-space: nowrap; }
#legend { display: flex; align-items: center; gap: 10px; max-width: 1100px; margin: 10px auto 8px; padding: 0 16px; font-size: 11px; color: #888; }
#legend-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; flex: 1; max-width: 280px; }
#legend-ticks { display: flex; justify-content: space-between; width: 280px; font-size: 10px; color: #aaa; margin-top: 3px; }
#legend-note { font-size: 11px; color: #aaa; margin: 0 16px 20px; max-width: 1100px; }
</style>
</head>
<body>
<header>
  <h1>Mondial 2026 — joueurs "exportés" par pays de naissance</h1>
  <p class="sub">Couleur : joueurs exportés / million d'hab. · 245 joueurs au total · Curaçao exclu · source : Wikipedia</p>
</header>
<div id="map-wrap">
  <svg id="map" viewBox="0 0 900 480" role="img" aria-label="Carte choroplèthe des pays de naissance des joueurs exportés au Mondial 2026"></svg>
</div>
<div id="legend">
  <span>≈0</span>
  <div>
    <div id="legend-bar"></div>
    <div id="legend-ticks"><span>0.01</span><span>0.03</span><span>0.10</span><span>0.30</span><span>1.0</span></div>
  </div>
  <span>1.1</span>
</div>
<p id="legend-note">joueurs exportés / million d'hab. · Gris : aucun joueur exporté · ● nation qualifiée au Mondial 2026</p>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>

33},{"name":"Alessandro Circati","nation":"Australia","caps":12},{"name":"Giuliano Simeone","nation":"Argentina","caps":11}],"nations":"Argentina, Australia, France","id":380},{"country":"Australia","count":2,"top":[{"name":"Lyndon Dykes","nation":"United Kingdom","caps":51},{"name":"Lachlan Bayliss","nation":"New Zealand","caps":3}],"nations":"New Zealand, United Kingdom","id":36},{"country":"Cameroon","count":2,"top":[{"name":"Breel Embolo","nation":"Switzerland","caps":86},{"name":"Yvon Mvogo","nation":"Switzerland","caps":13}],"nations":"Switzerland","id":120},{"country":"Ivory Coast","count":2,"top":[{"name":"Ismaël Koné","nation":"Canada","caps":39},{"name":"Marc Guéhi","nation":"United Kingdom","caps":27}],"nations":"Canada, United Kingdom","id":384},{"country":"Norway","count":2,"top":[{"name":"Sebastian Tounekti","nation":"Tunisia","caps":11},{"name":"Marko Farji","nation":"Iraq","caps":10}],"nations":"Iraq, Tunisia","id":578},{"country":"Senegal","count":2,"top":[{"name":"Amadou Onana","nation":"Belgium","caps":28},{"name":"Issa Laye","nation":"Qatar","caps":3}],"nations":"Belgium, Qatar","id":686},{"country":"Algeria","count":1,"top":[{"name":"Boualem Khoukhi","nation":"Qatar","caps":115}],"nations":"Qatar","id":12},{"country":"Burkina Faso","count":1,"top":[{"name":"Alban Lafont","nation":"Ivory Coast","caps":4}],"nations":"Ivory Coast","id":854},{"country":"Colombia","count":1,"top":[{"name":"Julián Quiñones","nation":"Mexico","caps":21}],"nations":"Mexico","id":170},{"country":"Croatia","count":1,"top":[{"name":"Ivan Bašić","nation":"Bosnia and Herzegovina","caps":16}],"nations":"Bosnia and Herzegovina","id":191},{"country":"Egypt","count":1,"top":[{"name":"Ahmed Alaaeldin","nation":"Qatar","caps":67}],"nations":"Qatar","id":818},{"country":"Ghana","count":1,"top":[{"name":"Mohammed Muntari","nation":"Qatar","caps":67}],"nations":"Qatar","id":288},{"country":"Guinea","count":1,"top":[{"name":"Mohamed Touré","nation":"Australia","caps":9}],"nations":"Australia","id":324},{"country":"Ireland","count":1,"top":[{"name":"Roberto Lopes","nation":"Cape Verde","caps":45}],"nations":"Cape Verde","id":372},{"country":"Kazakhstan","count":1,"top":[{"name":"Utkir Yusupov","nation":"Uzbekistan","caps":39}],"nations":"Uzbekistan","id":398},{"country":"Kenya","count":1,"top":[{"name":"Awer Mabil","nation":"Australia","caps":38}],"nations":"Australia","id":404},{"country":"Mexico","count":1,"top":[{"name":"Alejandro Zendejas","nation":"United States","caps":14}],"nations":"United States","id":484},{"country":"Nigeria","count":1,"top":[{"name":"Tani Oluwaseyi","nation":"Canada","caps":23}],"nations":"Canada","id":566},{"country":"Republic of the Congo","count":1,"top":[{"name":"Brice Samba","nation":"France","caps":4}],"nations":"France","id":178},{"country":"Saudi Arabia","count":1,"top":[{"name":"Adem Arous","nation":"Tunisia","caps":1}],"nations":"Tunisia","id":682},{"country":"Serbia","count":1,"top":[{"name":"Samed Baždar","nation":"Bosnia and Herzegovina","caps":12}],"nations":"Bosnia and Herzegovina","id":688},{"country":"Slovenia","count":1,"top":[{"name":"Tarik Muharemović","nation":"Bosnia and Herzegovina","caps":13}],"nations":"Bosnia and Herzegovina","id":705},{"country":"Sudan","count":1,"top":[{"name":"Almoez Ali","nation":"Qatar","caps":115}],"nations":"Qatar","id":729},{"country":"Tanzania","count":1,"top":[{"name":"Nestory Irankunda","nation":"Australia","caps":14}],"nations":"Australia","id":834},{"country":"Uruguay","count":1,"top":[{"name":"Gastón Olveira","nation":"Paraguay","caps":1}],"nations":"Paraguay","id":858},{"country":"Uzbekistan","count":1,"top":[{"name":"Waldemar Anton","nation":"Germany","caps":12}],"nations":"Germany","id":860},{"country":"Zambia","count":1,"top":[{"name":"Guus Til","nation":"Netherlands","caps":6}],"nations":"Netherlands","id":894}];

const POP = {
  "France":68.4,"Germany":84.4,"United Kingdom":68.3,"Netherlands":17.9,
  "Belgium":11.7,"Spain":47.4,"United States":335.9,"Sweden":10.5,
  "Argentina":46.0,"Austria":9.1,"Switzerland":8.7,"Portugal":10.3,
  "Bosnia and Herzegovina":3.2,"Brazil":215.3,"Canada":38.2,"Denmark":5.9,
  "Italy":59.7,"Australia":26.5,"Cameroon":28.0,"Ivory Coast":27.5,
  "Norway":5.5,"Senegal":17.8,"Algeria":45.6,"Burkina Faso":22.1,
  "Colombia":52.2,"Croatia":4.0,"Egypt":105.0,"Ghana":33.5,"Guinea":13.5,
  "Ireland":5.1,"Kazakhstan":19.6,"Kenya":55.1,"Mexico":129.2,"Nigeria":224.0,
  "Republic of the Congo":5.8,"Saudi Arabia":36.6,"Serbia":7.1,"Slovenia":2.1,
  "Sudan":47.7,"Tanzania":65.5,"Uruguay":3.5,"Uzbekistan":36.9,"Zambia":20.6
};

const byId = {};
DATA.forEach(d => {
  d.pop = POP[d.country] || null;
  d.ratio = d.pop ? +(d.count / d.pop).toFixed(2) : null;
  byId[d.id] = d;
});

const RATIO_MIN = 0.03;
const RATIO_MAX = 1.20;

const PALETTE = d3.interpolateRgbBasis(['#f3e8f7','#ddb8ea','#c285d8','#a354c2','#7b2d8b','#581f65','#361240']);
const normalize = r => (r - RATIO_MIN) / (RATIO_MAX - RATIO_MIN);
const color = r => PALETTE(Math.max(0, Math.min(1, normalize(r))));

const W = 900, H = 480;
const projection = d3.geoNaturalEarth1().scale(152).translate([W/2, H/2 + 10]);
const path = d3.geoPath(projection);
const svg = d3.select('#map');
const g = svg.append('g');
const tt = document.getElementById('tooltip');

svg.call(d3.zoom()
  .scaleExtent([1, 12])
  .on('zoom', e => g.attr('transform', e.transform)));

g.append('path').datum({type:'Sphere'})
  .attr('d', path).attr('fill','#d8d0e8').attr('stroke','#b4a8cc').attr('stroke-width',.5);

g.append('path').datum(d3.geoGraticule()())
  .attr('d', path).attr('fill','none').attr('stroke','#ccc4dc').attr('stroke-width',.25);

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world => {
  g.selectAll('.country')
    .data(topojson.feature(world, world.objects.countries).features)
    .join('path')
    .attr('class','country')
    .attr('d', path)
    .attr('fill', d => { const r = byId[+d.id]; return r && r.ratio !== null ? color(r.ratio) : '#e8e4e0'; })
    .attr('stroke','#ccc8c0').attr('stroke-width',.3)
    .on('mousemove', (event, d) => {
      const rec = byId[+d.id];
      if (!rec) { tt.style.display='none'; return; }
      const ratio = rec.ratio !== null ? rec.ratio.toFixed(2) : '?';
      const popStr = rec.pop ? (rec.pop >= 10 ? Math.round(rec.pop) + 'M' : rec.pop.toFixed(1) + 'M') : '?';
      let html = `<div class="tt-name">${rec.country}</div>`;
      html += `<div class="tt-count">${ratio}</div>`;
      html += `<div class="tt-label">joueur${rec.count>1?'s':''} exporté${rec.count>1?'s':''} / million d'hab.</div>`;
      html += `<div class="tt-sub">${rec.count} joueur${rec.count>1?'s':''} · pop. ${popStr}</div>`;
      html += `<div class="tt-nations">Sélections : ${rec.nations}</div>`;
      rec.top.forEach(p => {
        html += `<div class="tt-player"><span>${p.name}</span><span class="tt-nation">→ ${p.nation}</span></div>`;
      });
      tt.innerHTML = html;
      tt.style.display = 'block';
      let x = event.clientX + 16, y = event.clientY + 16;
      if (x + 270 > window.innerWidth) x = event.clientX - 274;
      if (y + 220 > window.innerHeight) y = event.clientY - 224;
      tt.style.left = x + 'px';
      tt.style.top  = y + 'px';
    })
    .on('mouseleave', () => { tt.style.display='none'; });

  g.append('path')
    .datum(topojson.mesh(world, world.objects.countries, (a,b) => a!==b))
    .attr('fill','none').attr('stroke','#b8b0a8').attr('stroke-width',.3).attr('d', path);

  // Dots centroïdes pour les 48 nations qualifiées
  const QUALIFIED_NAMES = {
    12:'Algeria', 32:'Argentina', 36:'Australia', 40:'Austria',
    56:'Belgium', 70:'Bosnia and Herzegovina', 76:'Brazil', 124:'Canada',
    132:'Cape Verde', 170:'Colombia', 191:'Croatia', 203:'Czech Republic',
    180:'DR Congo', 218:'Ecuador', 250:'France', 276:'Germany',
    288:'Ghana', 332:'Haiti', 364:'Iran', 368:'Iraq', 384:'Ivory Coast',
    392:'Japan', 400:'Jordan', 484:'Mexico', 504:'Morocco', 528:'Netherlands',
    554:'New Zealand', 578:'Norway', 591:'Panama', 600:'Paraguay',
    620:'Portugal', 634:'Qatar', 682:'Saudi Arabia', 686:'Senegal',
    710:'South Africa', 410:'South Korea', 724:'Spain', 752:'Sweden',
    756:'Switzerland', 788:'Tunisia', 792:'Turkey',
    826:'England / Scotland', 840:'United States', 858:'Uruguay', 860:'Uzbekistan'
  };

  // Coordonnées manuelles [lon, lat] pour les pays dont le centroïde auto est faussé
  // par des territoires d'outre-mer ou une géographie atypique
  const CENTROID_OVERRIDE = {
    250: [2.5, 46.5],    // France (sans outre-mer)
    840: [-98, 38],      // USA (sans Alaska/Hawaii)
    826: [-2, 54],       // UK
    638: [55.5, -21],    // Réunion — pas dans notre liste mais précaution
  };

  const dotCentroid = d => {
    const ov = CENTROID_OVERRIDE[+d.id];
    return ov ? projection(ov) : path.centroid(d);
  };

  g.selectAll('.dot-qualified')
    .data(topojson.feature(world, world.objects.countries).features.filter(d => QUALIFIED_NAMES[+d.id]))
    .join('circle')
    .attr('class','dot-qualified')
    .attr('cx', d => dotCentroid(d)[0])
    .attr('cy', d => dotCentroid(d)[1])
    .attr('r', 2.5)
    .attr('fill', '#c8a84b')
    .attr('stroke', '#fff')
    .attr('stroke-width', 0.6)
    .attr('pointer-events', d => byId[+d.id] ? 'none' : 'all')
    .on('mousemove', (event, d) => {
      const name = QUALIFIED_NAMES[+d.id];
      tt.innerHTML = `<div class="tt-name">${name}</div>`;
      tt.style.display = 'block';
      let x = event.clientX + 16, y = event.clientY + 16;
      if (x + 270 > window.innerWidth) x = event.clientX - 274;
      if (y + 80 > window.innerHeight) y = event.clientY - 84;
      tt.style.left = x + 'px';
      tt.style.top  = y + 'px';
    })
    .on('mouseleave', () => { tt.style.display = 'none'; });
});

const bar = document.getElementById('legend-bar');
const stops = Array.from({length: 60}, (_, i) => {
  const v = RATIO_MIN + (i / 59) * (RATIO_MAX - RATIO_MIN);
  return color(v);
});
bar.style.background = `linear-gradient(to right, ${stops.join(',')})`;
bar.style.borderRadius = '5px';
</script>
</body>
</html>
